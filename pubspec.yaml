name: nexus_loop
description: Endlosschleifen-Video-Player im Spotify-Stil.
publish_to: none
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.9.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  open_filex: ^4.4.0
